server:
  port: ${MS_AUTENTICACION_USUARIOS_PORT:${SERVER_PORT:8081}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${DB_USER:${DB_USERNAME}}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AutenticacionHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}
  jackson:
    default-property-inclusion: non_null
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  issuer: ${JWT_ISSUER:servillantas-auth}
app:
  security:
    registration:
      allowed-role: ${REGISTRATION_ALLOWED_ROLE:PERSONAL}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    refresh:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
logging:
  level:
    root: INFO
    com.servillantas.rv.autenticacion: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG:WARN}
